[workspace]
resolver = "3"
members = ["crates/tuvi-core", "web"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tuvi-core = { path = "crates/tuvi-core" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
