[project]
name = "tuvilm"
version = "0.1.0"
description = "Workspace root: installs every TuviLM package for development."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "lephuock", email = "phuockhanhnk94@gmail.com" },
    { name = "TrungDinhT", email = "dinhthanhtrung1996@gmail.com" },
]
dependencies = [
    "tuvi-engine",
    "tuvi-agent",
    "tuvi-api",
    "tuvi-tools",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "httpx>=0.27",
    "ruff>=0.17.5",
    "pyright>=1.1.414",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api", "tools"]

[tool.uv.sources]
tuvi-engine = { workspace = true }
tuvi-agent = { workspace = true }
tuvi-api = { workspace = true }
tuvi-tools = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Workspace packages are first-party code for import sorting.
src = [".", "packages/*/src", "apps/api/src", "tools/src"]

[tool.ruff.lint]
ignore = [
    # `type X = ...` makes a TypeAliasType, which pydantic and isinstance() treat
    # differently from a plain alias.
    "UP040",
    # Changing ValueError to TypeError would break callers that catch ValueError.
    "TRY004",
]

[tool.pyright]
include = ["packages", "apps/api/src", "tools/src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# Files that had type errors when pyright was added. Their errors are hidden.
# Fix a file, then remove it from this list.
ignore = [
    "apps/api/src/tuvi_api/accounts/routes.py",
    "apps/api/src/tuvi_api/chat/routes.py",
    "apps/api/src/tuvi_api/chat/storage/store.py",
    "packages/tuvi-agent/src/tuvi_agent/book_index.py",
    "packages/tuvi-agent/src/tuvi_agent/main.py",
    "packages/tuvi-agent/src/tuvi_agent/tool/ban_menh/laso_foundation.py",
    "packages/tuvi-agent/src/tuvi_agent/tool/cach_cuc/evaluator/scopes.py",
    "packages/tuvi-agent/src/tuvi_agent/tool/cach_cuc/evaluator/star_brightness.py",
    "packages/tuvi-agent/src/tuvi_agent/tool/thai_tue/vong_thai_tue.py",
    "packages/tuvi-agent/src/tuvi_agent/workflow/personality/agent.py",
    "packages/tuvi-agent/src/tuvi_agent/workflow/strength_weakness/agent.py",
    "packages/tuvi-engine/src/tuvi_engine/assembly/period.py",
    "packages/tuvi-engine/src/tuvi_engine/assembly/tu_hoa_phai.py",
    "packages/tuvi-engine/src/tuvi_engine/components/repository.py",
    "packages/tuvi-engine/src/tuvi_engine/context/natal.py",
    "packages/tuvi-engine/src/tuvi_engine/la_so.py",
    "packages/tuvi-engine/src/tuvi_engine/model/cung.py",
    "packages/tuvi-engine/src/tuvi_engine/model/elementary.py",
    "packages/tuvi-engine/src/tuvi_engine/model/period_layer_store.py",
    "packages/tuvi-engine/src/tuvi_engine/model/tinh_ban.py",
    "packages/tuvi-engine/src/tuvi_engine/placement/registry.py",
    "packages/tuvi-engine/src/tuvi_engine/placement/rules/declarations/resolvers.py",
    "packages/tuvi-engine/src/tuvi_engine/placement/rules/positions/absolute.py",
    "packages/tuvi-engine/src/tuvi_engine/placement/rules/positions/relative.py",
    "packages/tuvi-engine/src/tuvi_engine/placement/rules/registration.py",
    "packages/tuvi-engine/src/tuvi_engine/view/builder.py",
    "tools/src/tuvi_tools/cach_cuc/cach_cuc_editor.py",
    "tools/src/tuvi_tools/workflow_cli/strength_weakness_report.py",
    "tools/src/tuvi_tools/workflow_cli/view.py",
]
