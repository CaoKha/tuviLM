[project]
name = "tuvi-tools"
version = "0.1.0"
description = "Internal Streamlit tools: cách cục rule editor and chart viewer."
requires-python = ">=3.12"
dependencies = [
    "tuvi-engine",
    "pydantic>=2.9.2,<3",
    "pyyaml>=6.0.0,<7",
    "streamlit>=1.40.0,<2",
]

[tool.uv.sources]
tuvi-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
