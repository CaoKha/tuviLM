[package]
name = "tuvi-web"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde.workspace = true
toasty = { version = "0.11", features = ["postgresql"] }
toasty-cli = "0.11"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.12.1", default-features = false, features = ["asset", "discover", "font-fontsource", "icon-iconify", "router", "runtime", "serve", "tailwind", "ui", "view"] }

tuvi-core.workspace = true

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["icon-iconify", "tailwind"] }
